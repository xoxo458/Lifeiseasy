<title>Capstone Buyback Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f3ef; --surface:#ffffff; --surface-2:#faf9f6; --line:#e2dfd7; --line-2:#cfcbc0;
  --ink:#171d24; --body:#3d434a; --muted:#6f6b62;
  --brand:#0b5e55; --brand-soft:#e2efec; --brand-ink:#08443e;
  --brass:#a0701a; --brass-soft:#f6eeda;
  --ok:#1a7048; --ok-soft:#e4f1ea; --warn:#8c6206; --warn-soft:#f8eed6; --bad:#a03026; --bad-soft:#f8e6e3;
  --shadow:0 1px 2px rgba(20,25,32,.06),0 8px 24px -16px rgba(20,25,32,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1216; --surface:#151c22; --surface-2:#1a222a; --line:#28313a; --line-2:#3a4550;
  --ink:#eef1f3; --body:#c3cad1; --muted:#8d959d;
  --brand:#4dbba8; --brand-soft:#123430; --brand-ink:#9fded1;
  --brass:#d7a34e; --brass-soft:#33280f;
  --ok:#57bc8a; --ok-soft:#13301f; --warn:#d8a83f; --warn-soft:#332709; --bad:#e0796c; --bad-soft:#361915;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0d1216; --surface:#151c22; --surface-2:#1a222a; --line:#28313a; --line-2:#3a4550;
  --ink:#eef1f3; --body:#c3cad1; --muted:#8d959d;
  --brand:#4dbba8; --brand-soft:#123430; --brand-ink:#9fded1;
  --brass:#d7a34e; --brass-soft:#33280f;
  --ok:#57bc8a; --ok-soft:#13301f; --warn:#d8a83f; --warn-soft:#332709; --bad:#e0796c; --bad-soft:#361915;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif;color:var(--ink);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:19px;font-weight:700}h2{font-size:16.5px;font-weight:600}h3{font-size:14px;font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:Archivo;font-weight:700;font-size:13px;flex:none}
.brandname b{font-family:Archivo;font-size:15px;color:var(--ink);letter-spacing:.02em}
.brandname span{display:block;font-size:10.5px;color:var(--muted)}
.spacer{flex:1}
.pill-set{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.pill-set button{border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500}
.pill-set button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.env{font-size:10.5px;font-weight:600;color:var(--brass);background:var(--brass-soft);border:1px solid var(--line);padding:4px 8px;border-radius:6px;letter-spacing:.05em}

.shell{max-width:1400px;margin:0 auto;padding:16px;padding-block:18px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.shell{grid-template-columns:1fr}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow);position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
@media (max-width:920px){.rail{position:static}}
.rail .eyebrow{padding:8px 8px 4px}
.navitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--body);padding:7px 8px;border-radius:8px;text-align:left;font-size:12.5px}
.navitem:hover{background:var(--surface-2)}
.navitem[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.navitem .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.navitem[aria-current="true"] .dot{background:var(--brand)}
.navitem .n{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 6px;min-width:22px;text-align:center}
.navitem[aria-current="true"] .n{color:var(--brand-ink);background:var(--surface)}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-b{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub{font-size:12px;color:var(--muted);margin-top:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.kpi .v{font-family:Archivo;font-size:25px;font-weight:700;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11.5px;margin-top:4px}
.trend-ok{color:var(--ok);font-weight:600}.trend-bad{color:var(--bad);font-weight:600}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:8px}
.node{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:5px}
.node:hover{border-color:var(--brand);background:var(--surface)}
.node .st{font-size:10.5px;font-weight:600;color:var(--muted);font-family:"IBM Plex Mono"}
.node .nm{font-family:Archivo;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25}
.node .ct{font-size:11px;color:var(--muted)}
.node .bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.node .bar i{display:block;height:100%;background:var(--brand)}
.node.hot{border-left-color:var(--brass)}
.node.live{border-left-color:var(--brand)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
.ref{font-family:"IBM Plex Mono";font-weight:600;color:var(--brand);font-size:12px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2.5px 7px;border-radius:5px;border:1px solid transparent;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-brand{background:var(--brand-soft);color:var(--brand-ink)}
.t-mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-pri:hover{filter:brightness(1.08);color:#fff}
.btn-sm{padding:5px 9px;font-size:11.5px}
.btn-gh{border-color:transparent;background:var(--surface-2);color:var(--body)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fset{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.fset>.eyebrow{display:block;margin-bottom:4px;color:var(--brand-ink)}
.fset>.fhint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
label.f{display:block}
label.f>span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px}
input[readonly]{background:var(--brand-soft);color:var(--brand-ink);font-family:"IBM Plex Mono";font-weight:600;border-color:transparent}
textarea{min-height:56px;resize:vertical}
.calc{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.calc .ln{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.calc .ln:last-child{border-bottom:0}
.calc .ln b{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.calc .ln.sec{background:var(--surface-2);font-weight:600}
.calc .ln.sec span{color:var(--muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.calc .ln.sub-t b{color:var(--brand-ink)}
.calc .ln.total{background:var(--brand-soft)}
.calc .ln.total b,.calc .ln.total span{color:var(--brand-ink);font-weight:700}
.calc .ln.neg b{color:var(--bad)}
.calc .ln .why{font-size:10.5px;color:var(--muted);display:block;font-weight:400;letter-spacing:0;text-transform:none}

.chain li{list-style:none;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.chain li:last-child{border-bottom:0}
.chain .mark{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;border:1px solid var(--line-2);color:var(--muted);background:var(--surface-2);font-family:"IBM Plex Mono"}
.chain .mark.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chain .mark.now{background:var(--brand);color:#fff;border-color:transparent}
.chain .who{font-size:12.5px;color:var(--ink);font-weight:500}
.chain .meta{font-size:11px;color:var(--muted)}
ul.clean{margin:0;padding:0;list-style:none}

.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:700px){.cmp{grid-template-columns:1fr}}
.cmp>div{padding:12px 14px}
.cmp .was{background:var(--surface-2);border-right:1px solid var(--line)}
.cmp .now{background:var(--surface)}
.cmp h4{font-size:12px;margin-bottom:8px}
.cmp li{font-size:12px;padding:4px 0;display:flex;gap:7px;align-items:flex-start}
.cmp li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2);margin-top:6px;flex:none}
.cmp .now li::before{background:var(--brand)}

.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:154px 1fr 54px;gap:10px;align-items:center;font-size:12px}
@media (max-width:560px){.bars .b{grid-template-columns:104px 1fr 44px}}
.bars .track{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--brand)}
.bars .track.alt i{background:var(--brass)}
.bars .val{text-align:right;font-family:"IBM Plex Mono";font-size:11.5px;color:var(--muted)}

.drawer{position:fixed;inset:0;z-index:60;background:rgba(15,20,25,.45);display:flex;justify-content:flex-end}
.drawer-p{width:min(760px,100%);background:var(--paper);height:100%;overflow-y:auto;border-left:1px solid var(--line);padding:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px))}
.drawer-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.log{font-size:12px}
.log li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.log .ts{font-family:"IBM Plex Mono";font-size:11px;color:var(--muted);flex:none;width:94px}
.log b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);max-width:90vw}
.note{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:7px;padding:9px 11px}
.note b{color:var(--ink)}
.disc{font-size:10.5px;color:var(--muted);line-height:1.45;font-style:italic}
@media (prefers-reduced-motion:no-preference){.drawer-p{animation:sl .18s ease}@keyframes sl{from{transform:translateX(16px);opacity:.6}}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo">IM</div>
    <div class="brandname"><b>IMARAT&nbsp;&middot;&nbsp;Capstone</b><span>Buyback &amp; Refund Automation Desk</span></div>
    <div class="spacer"></div>
    <span class="env">DEMO DATA</span>
    <div class="pill-set" id="themeSet">
      <button type="button" data-th="light" onclick="setTheme('light')">Light</button>
      <button type="button" data-th="dark" onclick="setTheme('dark')">Dark</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
</div>
<div id="drawerHost"></div>
<div id="toastHost"></div>

<script>
/* ============ policy tables — from BB process flow, resale template, calc template ============ */
const TAX = {filer:0.03, nonfiler:0.06, latefiler:0.045};
const RENT_RATE = 0.045;            /* 45-day rental / monthly rent recovery */

const PRODUCTS = {
  'token-refund-hr': {name:'Token Refund — High Rental', ded:0.10, rental:true,  profit:false, asIs:38, toBe:26, docs:['Booking form','1-Link receiving slip','CNIC','Bank IBAN letter','Biometric']},
  'refund':          {name:'Refund',                     ded:0.10, rental:false, profit:false, asIs:42, toBe:28, docs:['Booking form','Payment receipts','CNIC','Bank IBAN letter','Biometric']},
  'installment':     {name:'Installment Refund',         ded:0.05, rental:false, profit:false, asIs:45, toBe:30, docs:['Installment ledger','CNIC','Bank IBAN letter','Biometric']},
  'cancellation':    {name:'Cancellation of Unit',       ded:0.15, rental:false, profit:false, asIs:52, toBe:32, docs:['Cancellation request','Original allotment','CNIC','Biometric','NOC']},
  'resale-buyback':  {name:'Resale / Buyback',           ded:0.10, rental:true,  profit:true,  asIs:55, toBe:34, docs:['Valuation sheet','Original allotment','CNIC','Bank IBAN letter','Biometric']},
  'profit-withdrawal':{name:'Profit Withdrawal',         ded:0,    rental:true,  profit:true,  asIs:45, toBe:24, docs:['Profit schedule','CNIC','Bank IBAN letter','Biometric']},
  'extra-amount':    {name:'Extra Amount Refund',        ded:0,    rental:false, profit:false, asIs:30, toBe:18, docs:['Excess payment proof','CNIC','Bank IBAN letter']},
  'resale-adj':      {name:'Resale Adjustment',          ded:0,    rental:false, profit:true,  asIs:35, toBe:20, docs:['Adjustment request','Original allotment','Target unit booking'], bookOnly:true},
  'refund-adj':      {name:'Refund Adjustment',          ded:0,    rental:false, profit:false, asIs:33, toBe:19, docs:['Adjustment request','Payment ledger','Target unit booking'], bookOnly:true}
};

const STAGES = [
  {id:'resale',   label:'Resale Desk',           dept:'Resale',   role:'Asst. Manager Resale', action:'Verify & forward to CCD',
   auto:['Resale template auto-filled from booking master','Total value = size × booking rate, computed live','Pro-rata profit calculated from receiving date to valuation date','Capstone unit status set to Blocked','Duplicate request check on Booking ID'],
   was:['Manual entry in Resale master & log sheet','Total value and profit typed into a separate calc sheet','Manual Capstone status change','Case walked over to CCD']},
  {id:'ccd',      label:'CCD Verification',      dept:'CCD',      role:'CCD Verification Officer', action:'Case verified — return to Resale',
   auto:['Paperless verification with auto-confirmation mail','Document criteria matrix checked against product rules','Biometric + CNIC match via NADRA API','Booking ID ↔ 1-Link payment ID reconciliation'],
   was:['Token cases not permissible for verification','Physical case verification','Docs criteria checked by eye','Case physically returned to Resale']},
  {id:'warehouse',label:'Doc Warehouse',         dept:'Resale',   role:'Records Officer', action:'Originals indexed — send to Finance',
   auto:['Originals scanned and indexed to the case ID','Copy / original custody logged digitally','Adjustment originals routed to Finance automatically'],
   was:['Copy & original doc warehouse maintained by hand','Original docs hand-carried to Finance']},
  {id:'rec',      label:'Finance — Receivables', dept:'Finance',  role:'Receivables Officer', action:'Balance & revenue verified',
   auto:['SAP balance pulled via API against the booking','Revenue recognition verified from the ledger','Monthly rent / 45-day rental recovery applied automatically','Outstanding dues netted off'],
   was:['SAP balance checked manually, case by case','Revenue verified on a side sheet','Rent deduction worked out on a calculator']},
  {id:'payable',  label:'Finance — Payables',    dept:'Finance',  role:'Payables Officer', action:'Accrual booked — send to Audit',
   auto:['Accrual auto-booked with a JV reference','Customer → Customer-Vendor balance transfer posted','Withholding tax slab applied from filer status'],
   was:['Accrual booking entered manually','Balance transfer posted by hand','Tax slab looked up manually per case']},
  {id:'audit',    label:'Audit',                 dept:'Audit',    role:'Audit Officer', action:'Audit cleared — release to Treasury',
   auto:['Whole trail replayed: every approval, document and figure','Independent recomputation of valuation, deduction and tax','Exception flags surfaced before sign-off'],
   was:['Each and everything verified manually across physical files']},
  {id:'treasury', label:'Treasury',              dept:'Treasury', role:'Treasury Officer', action:'Disburse & confirm',
   auto:['Direct bank transfer via payment API against the IBAN','Payment confirmation mail auto-sent to client and advisor','Capstone unit released to inventory on settlement'],
   was:['Cheque printed, signed and collected in person','Confirmation mail typed manually','Unit released late, sometimes missed']},
  {id:'settled',  label:'Settled',               dept:'—',        role:'—', action:null, auto:[], was:[]}
];
const SI = Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));

/* resale template approvals + calc template sign-off */
const APPROVERS = [
  {who:'Valuated By', desk:'Valuation prepared — Resale Desk'},
  {who:'Asst. Manager Resale', desk:'Template signed — Resale Desk'},
  {who:'Reviewed By', desk:'Resale review — Resale Desk'},
  {who:'Approved By Head of Resale', desk:'Resale sign-off — Resale Desk'},
  {who:'Verification by Legal Operations', desk:'Docs & KYC criteria — CCD'},
  {who:'Verification By Receivables', desk:'SAP balance & revenue — Finance'},
  {who:'Verification By Audit', desk:'Independent recomputation — Audit'}
];
const DISCLAIMER = 'The valuation provided herein is an indicative estimate based on available information and market conditions. It is subject to review and final approval by the concerned management and may be revised without prior notice. Errors and omissions are excepted (E&OE); no liability is assumed for decisions made based on this preliminary assessment.';

/* ============ the calculation engine (calc template → resale template) ============ */
function calc(c){
  const p = PRODUCTS[c.product] || PRODUCTS.refund;
  const size = +c.sizeSqft||0, rate = +c.bookingRate||0;
  const totalValue = size && rate ? size*rate : (+c.totalValue||0);
  const received = +c.receivedAmount||0;
  const months = c.proRataMonths!=null && c.proRataMonths!=='' ? +c.proRataMonths : monthsBetween(c.receivingDate, c.valuationDate);
  const profitPct = p.profit ? (+c.profitPct||0) : 0;
  const profitValue = Math.round(received * profitPct/100 * months/12);
  const payableWithProfit = received + profitValue;
  const discount = +c.discount||0;
  const rentPaid = (p.rental && c.rental45) ? (c.rentPaid!=null && c.rentPaid!=='' ? +c.rentPaid : Math.round(received*RENT_RATE)) : 0;
  const ded = Math.round(payableWithProfit * p.ded);
  const grossPayable = payableWithProfit - discount - rentPaid - ded;
  const rate_ = TAX[c.filer]||0;
  const tax = p.bookOnly ? 0 : Math.round(grossPayable * rate_);
  return {totalValue, size, rate, received, months, profitPct, profitValue, payableWithProfit,
          discount, rentPaid, ded, dedPct:p.ded, grossPayable, taxRate:rate_, tax,
          net:grossPayable - tax, bookOnly:!!p.bookOnly, profitApplies:p.profit};
}
function monthsBetween(a,b){
  if(!a||!b) return 0;
  const d1=new Date(a), d2=new Date(b);
  if(isNaN(d1)||isNaN(d2)) return 0;
  return Math.max(0, Math.round((d2-d1)/(30.44*86400000)));
}
const pk = n => Math.round(n||0).toLocaleString('en-PK');
const pct = r => (r*100).toFixed((r*100)%1?1:0)+'%';
const days = c => Math.max(1, Math.round((Date.now()-new Date(c.created))/86400000));
function slaState(c){
  const p=PRODUCTS[c.product], d=days(c);
  if(c.stage==='settled') return {tag:'t-ok', txt:'Settled in '+d+'d'};
  if(d > p.toBe) return {tag:'t-bad', txt:'SLA breached · day '+d};
  if(d > p.toBe*0.75) return {tag:'t-warn', txt:'At risk · day '+d};
  return {tag:'t-ok', txt:'On track · day '+d};
}

function mk(o){
  const c = Object.assign({id:'c'+(SEQ++), rental45:false, discount:0, profitPct:0, remarks:'', docs:{}, log:[]}, o);
  c.receivingDate = c.receivingDate || c.bookingDate;
  c.valuationDate = c.valuationDate || dback(Math.max(1,(c.age||1)-1));
  c.requestDate  = c.requestDate  || dback(c.age||1);
  c.proRataMonths = monthsBetween(c.receivingDate, c.valuationDate);
  PRODUCTS[c.product].docs.forEach(d=>c.docs[d]=true);
  const created = new Date(Date.now() - (c.age||1)*86400000);
  c.created = created.toISOString();
  const upto = SI[c.stage];
  c.log.push({ts:created, who:'Sales Advisor · Worksapp', txt:'Request received from advisor and auto-synced into the Resale template.'});
  for(let i=0;i<upto;i++){
    const st=STAGES[i], t=new Date(created.getTime()+(i+1)*((c.age||1)*86400000)/(upto+1));
    c.log.push({ts:t, who:st.dept+' · '+st.role, txt:st.action+' — '+st.auto.length+' automated checks passed.'});
  }
  return c;
}

          ln('Received amount', pk(m.received), '', 'Received '+fmtDate(c.receivingDate))+
          (m.profitApplies? ln('Profit '+m.profitPct+'% pro-rated over '+m.months+' months', pk(m.profitValue), '',
              'Receiving '+fmtDate(c.receivingDate)+' → valuation '+fmtDate(c.valuationDate)) : '')+
          ln('Payable with profit', pk(m.payableWithProfit), 'sub-t')+
          (m.discount? ln('Discount', '- '+pk(m.discount), 'neg'):'')+
          (m.rentPaid? ln('Paid monthly rent / 45-day rental', '- '+pk(m.rentPaid), 'neg', pct(RENT_RATE)+' of received amount'):'')+
          (m.ded? ln('Policy deduction · '+pct(m.dedPct), '- '+pk(m.ded), 'neg', p.name+' rule'):'')+
          ln('Gross payable', pk(m.grossPayable), 'sub-t')+
          (m.bookOnly? ln('Withholding tax','n/a — book transfer')
            : ln('Withholding tax · '+filerLabel(c.filer)+' '+pct(m.taxRate), '- '+pk(m.tax), 'neg'))+
          ln(m.bookOnly?'Amount adjusted to target unit':'Net payable to client', pk(m.net), 'total')+
        '</div>'+
        '<div class="grid2" style="margin-top:12px">'+
          kv('Asset type', (c.assetType||'—'))+kv('Booking date', fmtDate(c.bookingDate))+
          kv('Date of valuation', fmtDate(c.valuationDate))+kv('Pro-rata months', m.months)+
          kv('Cheque title / beneficiary', c.chequeTitle)+kv('IBAN — direct transfer', c.iban)+
          kv('1-Link payment ID', c.oneLink)+kv('CNIC', c.cnic)+
          kv('Advisor', c.agent+' · '+c.company)+kv('Regional', c.regional)+
        '</div>'+
        (c.remarks? '<div class="note" style="margin-top:12px"><b>Remarks:</b> '+esc(c.remarks)+'</div>':'')+
        '<p class="disc" style="margin:12px 0 0">'+DISCLAIMER+'</p>')+

      card('Documents &amp; KYC',
        '<div class="row">'+p.docs.map(d=>'<span class="tag '+(c.docs[d]?'t-ok':'t-bad')+'">'+(c.docs[d]?'&check; ':'&times; ')+esc(d)+'</span>').join('')+'</div>'+
        '<div class="note" style="margin-top:12px">The criteria matrix for <b>'+esc(p.name)+'</b> is checked on submission — a missing document holds the case at Resale instead of surfacing at Audit.</div>')+

      card('Approval chain',
        '<ul class="clean chain">'+APPROVERS.map((a,i)=>{
          const done = i < approverIdx, now = i === approverIdx && c.stage!=='settled';
          return '<li><span class="mark '+(done?'done':now?'now':'')+'">'+(done?'&check;':i+1)+'</span><div>'+
            '<div class="who">'+esc(a.who)+'</div><div class="meta">'+esc(a.desk)+(done?' · cleared':now?' · pending now':'')+'</div></div></li>';
        }).join('')+'</ul>')+

      card('Case trail','<ul class="clean log">'+c.log.slice().reverse().map(e=>
        '<li><span class="ts">'+fmtTs(e.ts)+'</span><div><b>'+esc(e.who)+'</b><div style="color:var(--muted)">'+esc(e.txt)+'</div></div></li>').join('')+'</ul>')+

      (st.action? '<div class="row"><button type="button" class="btn btn-pri" onclick="advance(\''+c.id+'\')">'+esc(st.action)+'</button>'+
        '<button type="button" class="btn" onclick="sendBack(\''+c.id+'\')">Return to previous desk</button></div>'
        : '<div class="note">Case settled. Payment confirmation mail sent and the unit released to inventory.</div>')+
    '</div></div></div>';
}

function advance(id){
  const c=CASES.find(x=>x.id===id), i=SI[c.stage], st=STAGES[i], nx=STAGES[i+1];
  c.log.push({ts:new Date(), who:st.dept+' · '+st.role, txt:st.action+' — '+st.auto.length+' automated checks passed, case routed to '+nx.label+'.'});
  c.stage=nx.id;
  if(nx.id==='settled') c.log.push({ts:new Date(), who:'System', txt:'Bank transfer executed via payment API. Confirmation mail sent to client and advisor; unit released to inventory.'});
  render();
  toast(nx.id==='settled' ? 'PKR '+pk(calc(c).net)+' disbursed to '+c.client+' — case closed.' : c.ref+' moved to '+nx.label+'.');
}
function sendBack(id){
  const c=CASES.find(x=>x.id===id), i=SI[c.stage];
  if(i===0){ toast('Already at the first desk — return it to the advisor instead.'); return; }
  const pv=STAGES[i-1];
  c.log.push({ts:new Date(), who:STAGES[i].dept+' · '+STAGES[i].role, txt:'Returned to '+pv.label+' with an observation. The clock keeps running on the same case ID.'});
  c.stage=pv.id; render(); toast(c.ref+' returned to '+pv.label+'.');
}

      f('Cheque title / beneficiary','chequeTitle','text','As per CNIC',0)+

      f('Booking rate (PKR / sq.ft)','bookingRate','number','31000',1,'31000')+

      f('Booking date','bookingDate','date','',0,'2022-02-17')+

const f = (label,id,type,ph,req,val) =>
  '<label class="f"><span>'+esc(label)+'</span><input id="'+id+'" type="'+type+'" placeholder="'+esc(ph||'')+'"'+
  (val!=null&&val!==''?' value="'+esc(val)+'"':'')+(req?' required':'')+'></label>';
const sel = (label,id,vals) =>
  '<label class="f"><span>'+esc(label)+'</span><select id="'+id+'">'+vals.map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label>';

function wireEntry(){
  ['sizeSqft','bookingRate','receivingDate','valuationDate','receivedAmount','profitPct','discount','rentPaid','product','filer','rental45']
    .forEach(i=>{const el=document.getElementById(i); if(el){el.addEventListener('input',liveCalc); el.addEventListener('change',liveCalc);}});
  liveCalc();
}
function readForm(){
  const g = id => {const el=document.getElementById(id); return el? el.value : '';};
  const fl = g('filer');
  return {
    booking:g('booking'), ref:g('ref'), mode:g('mode'), product:g('product'), requestedBy:g('requestedBy'),
    requestDate:g('requestDate'), recvCaseDate:g('recvCaseDate'),
    client:g('client'), cnic:g('cnic'), project:g('project'), unit:g('unit'), assetType:g('assetType'),
    chequeTitle:g('chequeTitle'), iban:g('iban'), oneLink:g('oneLink'),
    agent:g('agent'), regional:g('regional'), company:g('company'),
    sizeSqft:+g('sizeSqft')||0, bookingRate:+g('bookingRate')||0, bookingDate:g('bookingDate'),
    receivingDate:g('receivingDate'), valuationDate:g('valuationDate'),
    receivedAmount:+g('receivedAmount')||0, profitPct:+g('profitPct')||0, discount:+g('discount')||0,
    rental45:g('rental45')==='Yes', rentPaid:g('rentPaid'),
    filer: fl.indexOf('Non')===0?'nonfiler': fl.indexOf('Late')===0?'latefiler':'filer',
    valuatedBy:g('valuatedBy'), reviewedBy:g('reviewedBy'), remarks:g('remarks')
  };
}
function liveCalc(){
  const box=document.getElementById('liveCalc'); if(!box) return;
  const d=readForm(), p=PRODUCTS[d.product], m=calc(d);
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.value=v;};
  set('totalValueOut', m.totalValue? pk(m.totalValue) : '—');
  set('monthsOut', m.months);
  set('profitOut', m.profitApplies? pk(m.profitValue) : 'n/a for this product');
  set('pwpOut', pk(m.payableWithProfit));
  box.innerHTML =
    ln('Payable with profit', pk(m.payableWithProfit), 'sub-t', 'Received '+pk(m.received)+(m.profitApplies?' + profit '+pk(m.profitValue)+' ('+m.profitPct+'% × '+m.months+'/12)':''))+
    (m.discount? ln('Discount','- '+pk(m.discount),'neg'):'')+
    (m.rentPaid? ln('Paid monthly rent / 45-day rental','- '+pk(m.rentPaid),'neg'):'')+
    (m.ded? ln('Policy deduction · '+pct(m.dedPct),'- '+pk(m.ded),'neg'):'')+
    ln('Gross payable', pk(m.grossPayable), 'sub-t')+
    (m.bookOnly? ln('Withholding tax','n/a — book transfer')
      : ln('Withholding tax · '+filerLabel(d.filer)+' '+pct(m.taxRate),'- '+pk(m.tax),'neg'))+
    ln(m.bookOnly?'Amount adjusted to target unit':'Net payable to client', pk(m.net), 'total');
  document.getElementById('docNote').innerHTML =
    '<b>Documents required for '+esc(p.name)+':</b> '+p.docs.map(esc).join(' · ')+
    ' — checked automatically before the case can leave this desk. Target turnaround <b>'+p.toBe+' working days</b>, against '+p.asIs+' manually.';
}
function submitEntry(ev){
  ev.preventDefault();
  const d=readForm(), p=PRODUCTS[d.product];
  const c=Object.assign({}, d, {id:'c'+(SEQ++), docs:{}, log:[], created:new Date().toISOString(), stage:'ccd',
    ref:d.ref||('REF-'+SEQ), chequeTitle:d.chequeTitle||d.client, iban:d.iban||'—', oneLink:d.oneLink||'—',
    proRataMonths:monthsBetween(d.receivingDate,d.valuationDate)});
  p.docs.forEach(x=>c.docs[x]=true);
  const m=calc(c);
  c.log.push({ts:new Date(), who:'Resale · '+(d.valuatedBy||'Asst. Manager Resale'),
    txt:'Template submitted. Total value '+pk(m.totalValue)+', payable with profit '+pk(m.payableWithProfit)+', net '+pk(m.net)+' computed from '+p.name+' rules.'});
  c.log.push({ts:new Date(), who:'System',
    txt:'Capstone unit status set to Blocked. Duplicate check on '+c.booking+' clear. Case routed to CCD with auto-confirmation mail.'});
  CASES.unshift(c);
  entryOpen=false; view='ccd'; render();
  toast(c.ref+' created — net PKR '+pk(m.net)+', now at CCD Verification.');
  return false;
}

render();
