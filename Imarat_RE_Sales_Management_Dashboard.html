<style>
/* Layout: green/gold masthead, dark filter bar, two tabs of summary cards over a sheet-shaped table and charts. */
:root{
  --bg:#eef4ef; --surface:#ffffff; --ink:#14231b; --ink2:#4b5d52; --muted:#6a7b71;
  --line:#d9e6dc; --grid:#e7eee9; --head:#e8f2ea; --goldsoft:#f7f0d6;
  --b900:#0a3d24; --b700:#0f5c36; --b500:#1a8a52; --gold:#d4af37;
  --good:#0f7a43; --bad:#c23b2b; --warnbg:#fff4d6; --warnink:#5a4309; --warnline:#ecd48a;
  --s1:#146b40; --s2:#eb6834; --s3:#2a78d6;
  --p1:#2a78d6; --p2:#eb6834; --p3:#1baf7a; --p4:#eda100; --p5:#e87ba4; --p6:#008300; --pO:#9aa89f;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1611; --surface:#15231b; --ink:#e8f0ea; --ink2:#aebfb4; --muted:#8a9c91;
    --line:#26382d; --grid:#1f2f25; --head:#1b2d22; --goldsoft:#2b2711;
    --good:#4cc38a; --bad:#ef7b6f; --warnbg:#2e2711; --warnink:#f0dc9c; --warnline:#5b4a17;
    --s1:#3fa876; --s2:#d95926; --s3:#3987e5;
    --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --p6:#008300; --pO:#6f8076;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1611; --surface:#15231b; --ink:#e8f0ea; --ink2:#aebfb4; --muted:#8a9c91;
  --line:#26382d; --grid:#1f2f25; --head:#1b2d22; --goldsoft:#2b2711;
  --good:#4cc38a; --bad:#ef7b6f; --warnbg:#2e2711; --warnink:#f0dc9c; --warnline:#5b4a17;
  --s1:#3fa876; --s2:#d95926; --s3:#3987e5;
  --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#c98500; --p5:#d55181; --p6:#008300; --pO:#6f8076;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,select{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.inner{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */

.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}

.brand h1{margin:0;font:600 18px/1.15 var(--font-head)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 11px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--grid);background:var(--surface)}
thead th{background:var(--head);font-weight:600}

tr.tot td{font-weight:700;border-top:1.5px solid var(--ink2)}

/* charts */
.chart{position:relative;width:100%;min-height:240px}
.chart svg{display:block;max-width:100%}

.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--ink2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.pie-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.pie-lg{display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-width:150px}
.pie-lg div{display:flex;align-items:center;gap:8px}
.pie-lg b{margin-left:auto;padding-left:12px;font-weight:600}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 6px 22px rgba(0,0,0,.2);font-size:12px;max-width:250px}

</style>

<script>
/*PURE-START*/
const MON_ORDER=["Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun"];
function num(v){
  if(v===null||v===undefined||v==="") return null;
  if(typeof v==="number") return v;
  let s=String(v).trim();
  if(!s||s==="-"||s==="–") return null;
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  s=s.replace(/[^0-9.]/g,"");
  if(!s) return null;
  const n=parseFloat(s);
  return isNaN(n)?null:(neg?-n:n);
}
function monthFY(mon,yr){ return "FY "+(MON_ORDER.indexOf(mon)<6?yr+1:yr); }
function parseSheet(values){
  if(!Array.isArray(values)) return null;
  const h=values.findIndex(r=>Array.isArray(r)&&String(r[1]||"").trim().toLowerCase()==="description");
  if(h<0) return null;
  const head=values[h], months=[];
  for(let c=2;c<head.length;c++){
    const m=/^([A-Za-z]{3})[- ](\d{2})$/.exec(String(head[c]||"").trim());
    if(m){ const mon=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase(); months.push({col:c,label:mon+"-"+m[2],mon:mon,yr:2000+parseInt(m[2],10)}); }
  }
  if(!months.length) return null;
  let fyRow=null;
  for(let r=h-1;r>=0&&!fyRow;r--){
    const row=values[r];
    if(Array.isArray(row)&&row.some(x=>/^FY\s*\d{4}$/i.test(String(x||"").trim()))) fyRow=row;
  }
  months.forEach(m=>{
    const f=fyRow?String(fyRow[m.col]||"").trim():"";
    m.fy=/^FY\s*\d{4}$/i.test(f)?f.replace(/\s+/," ").toUpperCase():monthFY(m.mon,m.yr);
  });
  const rows=[]; let lastGap=true;
  for(let r=h+1;r<values.length;r++){
    const row=Array.isArray(values[r])?values[r]:[];
    const label=String(row[1]||"").trim();
    if(!label){ if(!lastGap&&rows.length){rows.push({type:"gap"});lastGap=true;} continue; }
    const cells=months.map(m=>num(row[m.col]));
    if(cells.every(x=>x===null)){ rows.push({type:"section",label:label}); lastGap=false; continue; }
    rows.push({type:"line",label:label,src:String(row[2]||"").trim(),vals:cells.map(x=>x===null?0:x)});
    lastGap=false;
  }
  while(rows.length&&rows[rows.length-1].type==="gap") rows.pop();
  return {months:months,rows:rows};
}
function filterIdx(T,fy,month){
  const out=[];
  T.forEach((m,i)=>{ if((fy==="Overall"||m.fy===fy)&&(month==="Overall"||m.mon===month)) out.push(i); });
  return out;
}
function rangeIdx(a,b){ const o=[]; for(let i=a;i<=b;i++) o.push(i); return o; }
function trendIdxOf(T,fy,month){
  const f=filterIdx(T,fy,month);
  if(month==="Overall"||fy==="Overall"||f.length!==1) return f;
  const sel=f[0];
  if(T[sel].mon==="Jul") return rangeIdx(Math.max(0,sel-2),sel);
  let st=sel; while(st>0&&T[st-1].fy===fy) st--;
  return rangeIdx(st,sel);
}
function findLine(sh,re){ return sh?sh.rows.find(r=>r.type==="line"&&re.test(r.label)):undefined; }
function sumRow(row,idx){ return row?idx.reduce((a,i)=>a+row.vals[i],0):0; }
function expenseLines(pl){
  const out=[]; let on=false;
  for(const r of pl.rows){
    if(r.type==="section"&&/cost of sales/i.test(r.label)){on=true;continue;}
    if(r.type==="line"&&/^net sales/i.test(r.label)){on=true;continue;}
    if(r.type==="line"&&/^total expenses/i.test(r.label)) break;
    if(on&&r.type==="line") out.push(r);
  }
  return out;
}
function calcSummary(pl,idx){
  const g=findLine(pl,/^gross sales/i), n=findLine(pl,/^net sales/i), e=findLine(pl,/^total expenses/i), p=findLine(pl,/^net profit/i);
  const gross=sumRow(g,idx), rev=n?sumRow(n,idx):gross, exp=sumRow(e,idx), pnl=p?sumRow(p,idx):rev-exp;
  return {gross:gross,rev:rev,fuel:gross-rev,exp:exp,pnl:pnl};
}
function calcReceivables(pl,cf,e){
  const upto=rangeIdx(0,e);
  const imarat=expenseLines(pl).filter(r=>/^imarat$/i.test(r.src));
  const R=imarat.reduce((a,r)=>a+sumRow(r,upto),0);
  const cfIdx=new Map(cf.months.map((m,i)=>[m.label,i]));
  const cfAt=(row,lbl)=>{ const i=cfIdx.get(lbl); return row&&i!==undefined?row.vals[i]:0; };
  const paid=findLine(cf,/^paid to imarat/i);
  const payments=[];
  for(let i=0;i<=e;i++){ const v=-cfAt(paid,pl.months[i].label); if(v!==0) payments.push({label:pl.months[i].label,amt:v}); }
  const received=payments.reduce((a,p)=>a+p.amt,0);
  const cumNP=sumRow(findLine(pl,/^net profit/i),upto);
  const zCash=findLine(cf,/^zameen payment/i), zAm=findLine(pl,/^zameen payment/i);
  let cash=0; for(let i=0;i<=e;i++) cash+=-cfAt(zCash,pl.months[i].label);
  const prepaid=Math.max(0,cash-sumRow(zAm,upto));
  return {asAt:pl.months[e].label,R:R,payments:payments,received:received,cumNP:cumNP,prepaid:prepaid,remaining:R-received};
}
function acctFmt(v,unit){
  if(v===null||v===undefined||isNaN(v)) return "–";
  if(v===0) return "–";
  const m=unit==="M", d=m?2:0, val=m?v/1e6:v, r=+val.toFixed(d);
  const s=Math.abs(r).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  return r<0?"("+s+")":s;
}
/*PURE-END*/

/* ---------- state ---------- */
const SHEET_ID="1vE7mA264f3plyc-tYScMmVkftXkVENLV7RL_5h_frrw";
const GVIZ_BASE="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet=";
const SHEETS={pl:"P%26L%20Detail",cf:"Cash%20Flow"};
const S={pl:null,cf:null,unit:"M",fy:"Overall",month:"Overall",tab:"t1",src:"none",syncedAt:null,err:null,syncing:false,mcp:null,fyKey:""};
const $=id=>document.getElementById(id);
const A=v=>acctFmt(v,S.unit);
const unitLbl=()=>S.unit==="M"?"PKR M":"PKR";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtTime(ms){ if(!ms) return ""; const d=new Date(ms); const same=new Date().toDateString()===d.toDateString();
  return same?d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString([], {day:"numeric",month:"short"})+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }

/* ---------- sync (via Claude MCP Google Sheets connector) ---------- */
function toMatrix(res){
  if(!res) return null;
  if(Array.isArray(res.values)) return res.values;
  let p=res.payload;
  if(typeof p==="string"){ try{p=JSON.parse(p);}catch(e){} }
  if(p&&Array.isArray(p.values)) return p.values;
  if(p&&p.valueRange&&Array.isArray(p.valueRange.values)) return p.valueRange.values;
  if(Array.isArray(p)) return p;
  if(res.structuredContent&&Array.isArray(res.structuredContent.values)) return res.structuredContent.values;
  const t=Array.isArray(res.content)?res.content.find(c=>c&&c.type==="text"):null;
  if(t){ try{ const j=JSON.parse(t.text); if(j&&Array.isArray(j.values)) return j.values; }catch(e){} }
  if(res.result){ const r=res.result; if(Array.isArray(r.values)) return r.values; if(r.payload&&Array.isArray(r.payload.values)) return r.payload.values; }
  return null;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function syncNow(retried){
  if(!S.mcp||S.syncing) return;
  S.syncing=true; setBusy(true);
  try{
    const a=await S.mcp.callTool("Google Sheets","get_values",{spreadsheetId:SHEET_ID,range:"'P&L Detail'"},{cache:false});
    console.log("[Dashboard] PL response:",JSON.stringify(a).slice(0,500));
    const b=await S.mcp.callTool("Google Sheets","get_values",{spreadsheetId:SHEET_ID,range:"'Cash Flow'"},{cache:false});
    console.log("[Dashboard] CF response:",JSON.stringify(b).slice(0,500));
    const m1=toMatrix(a), m2=toMatrix(b);
    if(!m1||!m2){ console.error("[Dashboard] toMatrix failed. m1:",!!m1,"m2:",!!m2); throw {code:"bad_shape",detail:"PL rows:"+!!(m1)+" CF rows:"+!!(m2)}; }
    const pl=m1&&parseSheet(m1), cf=m2&&parseSheet(m2);
    if(!pl||!cf) throw {code:"bad_shape"};
    S.pl=pl; S.cf=cf; S.src="live"; S.syncedAt=Date.now(); S.err=null;
  }catch(e){
    console.error("[Dashboard] sync error:",e);
    if(e&&e.retryable&&!retried){ S.syncing=false; await sleep((e.retryAfterMs||1500)+Math.random()*600); return syncNow(true); }
    S.err=e||{code:"unknown"};
  }
  S.syncing=false; setBusy(false); renderAll();
}
function setBusy(b){ const s=$("sync"); s.disabled=b; s.classList.toggle("busy",b); }
function errText(e){
  const c=e&&e.code;
  if(c==="no_mcp") return "Google Sheets connector not available. Open this dashboard inside Claude to enable live sync.";
  if(c==="server_not_connected"||c==="selection_required") return "Google Sheets is not connected. Add it in Claude Settings → Connectors, then press Sync.";
  if(c==="bad_shape") return "The sheet came back in a layout this dashboard does not recognise. Check the Description and month header rows.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return "Access to Google Sheets was not allowed for this page. Press Sync to be asked again.";
  const m=e&&(e.message||e.detail||""); return "Sync error"+(c?" ("+c+")":"")+(m?": "+m:"")+". Press Sync to retry.";
}

/* ---------- chart helpers ---------- */
function niceTicks(min,max,n){
  if(min===max) max=min+1;
  const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), nm=raw/mag;
  const step=(nm<=1?1:nm<=2?2:nm<=2.5?2.5:nm<=5?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+step/2;v+=step) t.push(+v.toFixed(6));
  return t;
}
function axisFmt(v){
  if(S.unit==="M"){ const x=v/1e6; return (Math.abs(x)>=10?x.toFixed(0):+x.toFixed(1)).toString(); }
  const a=Math.abs(v); if(a>=1e6) return +(v/1e6).toFixed(1)+"M"; if(a>=1e3) return +(v/1e3).toFixed(0)+"K"; return String(v);
}
function monoPath(pts){
  const n=pts.length; if(n<2) return "";
  const dx=[],m=[],t=[];
  for(let i=0;i<n-1;i++){ dx[i]=pts[i+1][0]-pts[i][0]; m[i]=(pts[i+1][1]-pts[i][1])/(dx[i]||1); }
  t[0]=m[0]; t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++) t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i]===0){t[i]=0;t[i+1]=0;continue;}
    const a=t[i]/m[i], b=t[i+1]/m[i], s=a*a+b*b;
    if(s>9){const k=3/Math.sqrt(s); t[i]=k*a*m[i]; t[i+1]=k*b*m[i];}
  }
  let d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(let i=0;i<n-1;i++){
    const h=dx[i]/3;
    d+=" C"+(pts[i][0]+h).toFixed(1)+","+(pts[i][1]+t[i]*h).toFixed(1)+" "+(pts[i+1][0]-h).toFixed(1)+","+(pts[i+1][1]-t[i+1]*h).toFixed(1)+" "+pts[i+1][0].toFixed(1)+","+pts[i+1][1].toFixed(1);
  }
  return d;
}

function attachHover(svg,xs,labels,rowsFor){

  attachHover(el.querySelector("svg"),xs,labels,i=>[{c:vals[i]<0?"var(--s2)":"var(--s1)",n:"Net cashflow",v:A(vals[i])||"–"}]);
}
function pieChart(el,slices){
  const total=slices.reduce((a,s)=>a+s.v,0);
  if(total<=0){ el.innerHTML='<div class="empty">No expenses in this period.</div>'; return; }
  const W=el.clientWidth||400, size=Math.round(Math.max(150,Math.min(300,W<440?W-8:W*0.5))), r=size/2;
  let ang=-Math.PI/2, paths="";
  slices.forEach((s,i)=>{
    const a=s.v/total*Math.PI*2, a2=ang+a, x1=r+r*Math.cos(ang), y1=r+r*Math.sin(ang), x2=r+r*Math.cos(a2), y2=r+r*Math.sin(a2);
    paths+= slices.length===1?`<circle data-i="${i}" cx="${r}" cy="${r}" r="${r-1}" style="fill:${s.c};stroke:var(--surface)" stroke-width="2"/>`
      :`<path data-i="${i}" d="M${r},${r} L${x1.toFixed(2)},${y1.toFixed(2)} A${r-1},${r-1} 0 ${a>Math.PI?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" style="fill:${s.c};stroke:var(--surface)" stroke-width="2"/>`;
    ang=a2;
  });
  el.innerHTML=`<div class="pie-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Expense breakdown by line">${paths}</svg><div class="pie-lg">${slices.map(s=>`<div><i class="sw" style="background:${s.c}"></i><span>${esc(s.n)}</span><b>${(s.v/total*100).toFixed(1)}%</b></div>`).join("")}</div></div>`;
  el.querySelectorAll("[data-i]").forEach(n=>{
    const s=slices[+n.getAttribute("data-i")];
    const f=e=>showTip(e,s.n,[{c:s.c,n:(s.v/total*100).toFixed(1)+"% of expenses",v:A(s.v)}]);
    n.addEventListener("pointermove",f); n.addEventListener("pointerdown",f); n.addEventListener("pointerleave",hideTip);
  });
}

/* ---------- render ---------- */
function kpi(cls,label,val,sub){ return `<div class="kpi ${cls}"><div class="k-label">${label}</div><div class="k-val">${val}<span class="k-unit">${unitLbl()}</span></div><div class="k-sub">${sub}</div></div>`; }
function kpiBlank(cls,label){ return `<div class="kpi ${cls}"><div class="k-label">${label}</div><div class="k-val">–</div><div class="k-sub">Waiting for sheet data</div></div>`; }
function winLabel(idx){ if(!idx.length) return ""; const T=S.pl.months; return idx.length===1?T[idx[0]].label:T[idx[0]].label+" to "+T[idx[idx.length-1]].label; }
function scopeText(idx){
  if(!idx.length) return "No data for this selection";
  return (S.fy==="Overall"?"All years":S.fy)+" · "+(S.month==="Overall"?"all months":S.month+(S.fy==="Overall"?" across years":""))+" · "+winLabel(idx);
}
function renderChrome(){
  const p=$("pill"); let st="loading", tx="Connecting to Google Sheets";
  if(S.src==="live"){ st="live"; tx="Live · synced "+fmtTime(S.syncedAt); }
  else if(S.src==="cache"){ st="cache"; tx="Saved copy · "+fmtTime(S.syncedAt); }
  else if(S.err){ st="error"; tx="Not connected"; }
  p.setAttribute("data-s",st); $("pillTxt").textContent=tx;
  const b=$("banner");
  if(S.err){ b.hidden=false; $("bannerTxt").textContent=errText(S.err); } else b.hidden=true;
  $("sync").disabled=S.syncing||(!S.mcp);
  $("sync").title=S.mcp?"Read the latest data from the Google Sheet":"Connect Google Sheets in Claude Settings → Connectors";
  $("uM").setAttribute("aria-pressed",S.unit==="M"); $("uR").setAttribute("aria-pressed",S.unit==="R");
}
function renderEmpty(){
  $("kpi1").innerHTML=kpiBlank("rev","Revenue")+kpiBlank("exp","Total Expense")+kpiBlank("pl","Profit / Loss")+kpiBlank("rec","Receivable from RE Sales");
  $("kpi2").innerHTML=kpiBlank("tot","Total Receivable from RE")+kpiBlank("got","Amount Received from RE")+kpiBlank("rec","Remaining Receivable from RE");
  const msg='<div class="empty">'+(S.err?esc(errText(S.err)):"Reading the Google Sheet…")+'</div>';
  ["plBox","trend","pie","recBox","acc","net"].forEach(id=>{$(id).innerHTML=msg;});
  ["plSub","trendSub","pieSub","recSub","accSub","netSub"].forEach(id=>{$(id).textContent="";});
}
function plTable(idx){
  const pl=S.pl, T=pl.months, multi=idx.length>1, ncol=2+idx.length+(multi?1:0);
  let h1='<tr><th rowspan="2" class="c1">Description</th><th rowspan="2" class="src">Paid / Received From</th>', i=0;
  while(i<idx.length){ let j=i; while(j+1<idx.length&&T[idx[j+1]].fy===T[idx[i]].fy) j++; h1+=`<th class="fy" colspan="${j-i+1}">${esc(T[idx[i]].fy)}</th>`; i=j+1; }
  if(multi) h1+='<th rowspan="2">Total</th>';
  h1+="</tr><tr>"+idx.map(k=>`<th>${esc(T[k].label)}</th>`).join("")+"</tr>";
  let body="";
  pl.rows.forEach(r=>{
    if(r.type==="gap"){ body+=`<tr class="gap"><td colspan="${ncol}"></td></tr>`; return; }
    if(r.type==="section"){ body+=`<tr class="sec"><td class="c1" colspan="${ncol}">${esc(r.label)}</td></tr>`; return; }
    const net=/^net profit/i.test(r.label), tot=/^(net sales|total expenses|ebitda)/i.test(r.label);
    const cell=v=>`<td${v<0?' class="neg"':""}>${A(v)}</td>`;
    body+=`<tr${net?' class="net"':tot?' class="tot"':""}><td class="c1">${esc(r.label)}</td><td class="src">${esc(r.src)}</td>${idx.map(k=>cell(r.vals[k])).join("")}${multi?cell(sumRow(r,idx)):""}</tr>`;
  });
  const eb=findLine(pl,/^ebitda/i), np=findLine(pl,/^net profit/i);
  const quirk=eb&&np&&np.vals.some(v=>v<0)&&eb.vals.every((v,k)=>Math.abs(v)===Math.abs(np.vals[k]));
  return `<div class="tw"><table><thead>${h1}</thead><tbody>${body}</tbody></table></div>`+(quirk?'<p class="note">The EBITDA row in the sheet shows losses as positive figures. Profit / Loss on this dashboard uses the Net Profit row.</p>':"");
}
function recTable(rc){
  const row=(l,v,cls)=>`<tr${cls?` class="${cls}"`:""}><td class="c1">${l}</td><td${v<0?' class="neg"':""}>${A(v)}</td></tr>`;
  let b=row("Receivable from RE (expenses paid by Imarat)",rc.R);
  rc.payments.forEach(p=>{ b+=row("Paid to Imarat · "+esc(p.label),-p.amt); });
  b+=row("Remaining receivable from RE",rc.remaining,"net");
  return `<div class="tw"><table class="rec"><thead><tr><th class="c1">Item</th><th>${unitLbl()}</th></tr></thead><tbody>${b}</tbody></table></div>`;
}
function renderAll(){
  renderChrome(); buildFilters();
  if(!S.pl){ renderEmpty(); return; }
  const T=S.pl.months, idx=filterIdx(T,S.fy,S.month), tr=trendIdxOf(T,S.fy,S.month);
  const sc=scopeText(idx);
  if(!idx.length){
    $("kpi1").innerHTML=kpiBlank("rev","Revenue")+kpiBlank("exp","Total Expense")+kpiBlank("pl","Profit / Loss")+kpiBlank("rec","Receivable from RE Sales");
    $("kpi2").innerHTML=kpiBlank("tot","Total Receivable from RE")+kpiBlank("got","Amount Received from RE")+kpiBlank("rec","Remaining Receivable from RE");
    ["plBox","trend","pie","recBox","acc","net"].forEach(id=>{$(id).innerHTML='<div class="empty">No data for this selection.</div>';});
    return;
  }
  const sm=calcSummary(S.pl,idx), e=idx[idx.length-1];
  const rc=S.cf?calcReceivables(S.pl,S.cf,e):null;
  $("kpi1").innerHTML=
    kpi("rev","Revenue",A(sm.rev)||"–","Net of fuel · gross "+(A(sm.gross)||"–"))+
    kpi("exp","Total Expense",A(sm.exp)||"–",(sm.rev?(sm.exp/sm.rev*100).toFixed(1)+"% of revenue":"No revenue in period"))+
    kpi("pl"+(sm.pnl<0?" loss":""),"Profit / Loss",A(sm.pnl)||"–",sm.pnl<0?"Loss for the period":"Profit for the period")+
    (rc?kpi("rec","Receivable from RE Sales",A(rc.remaining)||"–","As at "+esc(rc.asAt)):kpiBlank("rec","Receivable from RE Sales"));
  $("plSub").textContent=sc+" · "+unitLbl();
  $("plBox").innerHTML=plTable(idx);

  $("trendSub").textContent=winLabel(tr)+" · "+unitLbl();
  const ns=findLine(S.pl,/^net sales/i)||findLine(S.pl,/^gross sales/i), te=findLine(S.pl,/^total expenses/i), np=findLine(S.pl,/^net profit/i);
  const lab=tr.map(i=>T[i].label), pick=row=>tr.map(i=>row?row.vals[i]:0);
  lineChart($("trend"),lab,[
    {name:"Revenue",color:"var(--s1)",vals:pick(ns)},
    {name:"Expense",color:"var(--s2)",vals:pick(te)},
    {name:"Profit/Loss",color:"var(--s3)",vals:pick(np),dash:"5 4"}
  ],{area:true,aria:"Revenue, expense and profit or loss by month"});

  // expense mix: top six lines overall keep a fixed colour, the rest fold into Other
  const lines=expenseLines(S.pl), allIdx=T.map((_,i)=>i);
  const ranked=lines.slice().sort((a,b)=>Math.abs(sumRow(b,allIdx))-Math.abs(sumRow(a,allIdx)));
  const top=ranked.slice(0,6), cols=["--p1","--p2","--p3","--p4","--p5","--p6"], slices=[];
  top.forEach((l,k)=>{ const v=sumRow(l,idx); if(v>0) slices.push({n:l.label.replace(/\s*\(amortized.*\)/i,""),v:v,c:"var("+cols[k]+")"}); });
  const other=ranked.slice(6).reduce((a,l)=>a+sumRow(l,idx),0);
  if(other>0) slices.push({n:"Other lines",v:other,c:"var(--pO)"});
  slices.sort((a,b)=>b.v-a.v);
  $("pieSub").textContent=sc;
  pieChart($("pie"),slices);

  if(!S.cf||!rc){ $("kpi2").innerHTML=kpiBlank("tot","Total Receivable from RE")+kpiBlank("got","Amount Received from RE")+kpiBlank("rec","Remaining Receivable from RE"); $("recBox").innerHTML='<div class="empty">Cash Flow tab not available.</div>'; return; }
  $("kpi2").innerHTML=
    kpi("tot","Total Receivable from RE",A(rc.R)||"–","Expenses paid by Imarat to "+esc(rc.asAt))+
    kpi("got","Amount Received from RE",A(rc.received)||"–",rc.payments.length+" payment"+(rc.payments.length===1?"":"s")+" to Imarat")+
    kpi("rec","Remaining Receivable from RE",A(rc.remaining)||"–","Receivable less amounts received");
  $("recSub").textContent="As at "+rc.asAt+", cumulative from the start of the project · "+unitLbl();
  $("recBox").innerHTML=recTable(rc);

  const CT=S.cf.months, cIdx=tr.map(i=>CT.findIndex(m=>m.label===T[i].label)).filter(i=>i>=0);
  const acc=findLine(S.cf,/^accumulated cashflow/i), net=findLine(S.cf,/^monthly cashflow/i), cl=cIdx.map(i=>CT[i].label);
  $("accSub").textContent=winLabel(tr)+" · "+unitLbl();
  $("netSub").textContent=winLabel(tr)+" · "+unitLbl();
  lineChart($("acc"),cl,[{name:"Accumulated cashflow",color:"var(--s1)",vals:cIdx.map(i=>acc?acc.vals[i]:0)}],{area:true,aria:"Accumulated cashflow by month"});
  barChart($("net"),cl,cIdx.map(i=>net?net.vals[i]:0),{aria:"Net cashflow by month"});
}

/* ---------- events ---------- */
$("fy").addEventListener("change",e=>{ S.fy=e.target.value; S.month="Overall"; renderAll(); });
$("mo").addEventListener("change",e=>{ S.month=e.target.value; renderAll(); });
$("reset").addEventListener("click",()=>{ S.fy="Overall"; S.month="Overall"; renderAll(); });
$("uM").addEventListener("click",()=>{ S.unit="M"; renderAll(); });
$("uR").addEventListener("click",()=>{ S.unit="R"; renderAll(); });
$("sync").addEventListener("click",()=>{ if(S.mcp) syncNow(false); });
function setTab(id){
  S.tab=id;
  ["t1","t2"].forEach(t=>{ $(t).hidden=t!==id; $("tab"+t.slice(1)).setAttribute("aria-selected",t===id); });
  renderAll();
}
$("tab1").addEventListener("click",()=>setTab("t1"));
$("tab2").addEventListener("click",()=>setTab("t2"));
let lastW=0;
if(window.ResizeObserver){ new ResizeObserver(()=>{ const w=document.body.clientWidth; if(Math.abs(w-lastW)>6){ lastW=w; if(S.pl) renderAll(); } }).observe(document.body); }

/* ---------- boot ---------- */
(function loadEmbedded(){
  try{
    const pl=parseSheet(EMBED.pl), cf=parseSheet(EMBED.cf);
    if(pl&&cf){ S.pl=pl; S.cf=cf; S.src="cache"; S.syncedAt=Date.parse(EMBED.syncedAt)||null; }
  }catch(e){}
})();
renderAll();
(function boot(){
  const c=window.claude;
  if(!c||!c.use){ S.err={code:"no_mcp"}; renderChrome(); return; }
  c.use("mcp").then(m=>{
    S.mcp=m;
    if(m){ renderChrome(); syncNow(false); }
    else { S.err={code:"no_mcp"}; renderAll(); }
  }).catch(()=>{ S.err={code:"no_mcp"}; renderAll(); });
  setInterval(()=>{ if(!document.hidden&&S.mcp&&S.src==="live") syncNow(false); },120000);
})();
</script>

</body></html>
